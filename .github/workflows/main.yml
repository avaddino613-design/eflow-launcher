name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's runners ship with an Android SDK already, exposed via
      # $ANDROID_SDK_ROOT. We just need the cmdline-tools on PATH and the
      # specific platform/build-tools this project targets installed.
      - name: Configure Android SDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # This repo intentionally doesn't commit gradle-wrapper.jar (a binary
      # file) - setup-gradle installs a pinned Gradle version directly
      # instead, so the build below calls `gradle`, not `./gradlew`.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pageflow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
